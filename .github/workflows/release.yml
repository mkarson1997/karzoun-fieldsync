name: Release

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "build.gradle.kts"
      - "src/**"
      - "README.md"
      - "CHANGELOG.md"
      - "RELEASE_NOTES.md"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Release package validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            version="0.0.0-pr.${{ github.event.pull_request.number }}"
          else
            version="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build reviewed artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gradle clean test jar sourcesJar generatePomFileForMavenPublication \
            -PreleaseVersion="$VERSION" \
            --warning-mode=fail

      - name: Assemble release bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          mkdir -p artifacts
          cp "build/libs/karzoun-fieldsync-${VERSION}.jar" "artifacts/karzoun-fieldsync-${VERSION}.jar"
          cp "build/libs/karzoun-fieldsync-${VERSION}-sources.jar" "artifacts/karzoun-fieldsync-${VERSION}-sources.jar"
          cp "build/publications/maven/pom-default.xml" "artifacts/karzoun-fieldsync-${VERSION}.pom"
          (
            cd artifacts
            sha256sum "karzoun-fieldsync-${VERSION}.jar" \
                      "karzoun-fieldsync-${VERSION}-sources.jar" \
                      "karzoun-fieldsync-${VERSION}.pom" > SHA256SUMS.txt
          )

      - name: Verify checksums
        run: |
          cd artifacts
          sha256sum -c SHA256SUMS.txt

      - name: Upload reviewed release bundle
        uses: actions/upload-artifact@v4
        with:
          name: fieldsync-release-${{ steps.version.outputs.version }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release and Maven package
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4

      - name: Set up JDK and Maven credentials
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download reviewed release bundle
        uses: actions/download-artifact@v4
        with:
          name: fieldsync-release-${{ steps.version.outputs.version }}
          path: artifacts

      - name: Verify downloaded bundle
        run: |
          cd artifacts
          sha256sum -c SHA256SUMS.txt

      - name: Publish exact Maven artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mvn --batch-mode deploy:deploy-file \
            -DrepositoryId=github \
            -Durl="https://maven.pkg.github.com/${GITHUB_REPOSITORY}" \
            -Dfile="artifacts/karzoun-fieldsync-${VERSION}.jar" \
            -Dsources="artifacts/karzoun-fieldsync-${VERSION}-sources.jar" \
            -DpomFile="artifacts/karzoun-fieldsync-${VERSION}.pom"

      - name: Attest JAR provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: artifacts/*.jar

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "Karzoun FieldSync $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md
