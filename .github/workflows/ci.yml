name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: JDK ${{ matrix.java }} build and deterministic tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["21", "25"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Verify
        run: gradle clean check --warning-mode=fail

  ci-gate:
    name: CI Gate
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Require matrix success
        run: |
          test "${{ needs.test.result }}" = "success"
